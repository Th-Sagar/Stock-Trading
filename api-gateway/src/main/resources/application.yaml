spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
#            swagger docs
            - id: user-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/(?<path>.*), /$\{path}

            - id: market-data-service-docs
              uri: http://localhost:8082
              predicates:
                - Path=/market-data-service/v3/api-docs
              filters:
                - RewritePath=/market-data-service/(?<path>.*), /$\{path}

            - id: order-service-docs
              uri: http://localhost:8083
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/(?<path>.*), /$\{path}

            - id: portfolio-service-docs
              uri: http://localhost:8084
              predicates:
                - Path=/portfolio-service/v3/api-docs
              filters:
                - RewritePath=/portfolio-service/(?<path>.*), /$\{path}


            # Public user interface
            - id: user-service-public
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/register,/api/v1/users/login

            # User service (requires authentication)
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: JwtAuthFilter

            # Market data service
            - id: market-data-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/market/**
              filters:
                - name: JwtAuthFilter

            # WebSocket
            - id: market-websocket
              uri: ws://localhost:8082
              predicates:
                - Path=/ws/**

            # Order service
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: JwtAuthFilter

            # Portfolio service
            - id: portfolio-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/portfolio/**
              filters:
                - name: JwtAuthFilter

server:
  port: 8080

jwt:
  secret: k8fJ2mQ9xV7pL3nR5tY8wZ1aB4cD6eF0gH2iJ4kL6mM=

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: market-data-service
        url: /market-data-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
      - name: portfolio-service
        url: /portfolio-service/v3/api-docs