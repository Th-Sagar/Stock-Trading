spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Public user interface
            - id: user-service-public
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/register,/api/v1/users/login

            # User service (requires authentication)
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: JwtAuthFilter

            # Market data service
            - id: market-data-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/market/**
              filters:
                - name: JwtAuthFilter

            # WebSocket
            - id: market-websocket
              uri: ws://localhost:8082
              predicates:
                - Path=/ws/**

            # Order service
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: JwtAuthFilter

            # Portfolio service
            - id: portfolio-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/portfolio/**
              filters:
                - name: JwtAuthFilter

server:
  port: 8080

jwt:
  secret: k8fJ2mQ9xV7pL3nR5tY8wZ1aB4cD6eF0gH2iJ4kL6mM=

