spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

#        routes
        - id: user-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/register, /api/v1/users/login

#            user -service

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filter:
            - name: JwtAuthFilter

# market-data-service
        - id: market-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/market/**
          filter:
            - name: JwtAuthFilter

        # websocket
        - id: market-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**
            -
        # order-service
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filter:
            - name: JwtAuthFilter

        # portfolio-service
        - id: portfolio-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portfolio/**
          filter:
            - name: JwtAuthFilter

server:
  port: 8080

