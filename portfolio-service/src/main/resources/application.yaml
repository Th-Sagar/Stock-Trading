spring:
  application:
    name: portfolio-service
  datasource:
    url: jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  Kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: portfolio-service-group
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.utilHashMap

server:
  port: 8884

market:
  service:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health, info